<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chowk Storefront</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Yatra+One&family=Spectral:ital,wght@0,400;0,500;1,400;1,500&family=Cinzel:wght@400;600;700&family=Tiro+Tamil:ital@0;1&display=swap');
        body { margin: 0; background: #1A0F0A; font-family: 'Spectral', serif; color: #1A0F0A; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .scroll-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="root">
        <div style="color: #DAA520; text-align: center; padding-top: 50px;">Loading Chowk...</div>
    </div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        /* ── ICONS (Built-in SVGs to avoid loading errors) ── */
        const IconBack = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>;
        const IconRight = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>;

        /* ── ISO MATH ── */
        const TW=40, TH=20, HU=26, OX=285, OY=205;
        const iso = (c,r,h=0) => ({ x: OX+(c-r)*TW/2, y: OY+(c+r)*TH/2-h*HU });
        const pts = (arr) => arr.map(({x,y}) => x.toFixed(1) + "," + y.toFixed(1)).join(" ");

        /* ── DATA ── */
        const SHOPS = [
            { id: "lakshmi", name: "Lakshmi", fullName: "Lakshmi Vegetables", tamil: "லட்சுமி காய்கறிகள்", origin: "Hosur · Ooty", colors: {top:"#C4A820", front:"#D8B830", left:"#8B1A1A"}, emoji: "🥬", col: 0, row: 0, w: 3, d: 2, h: 4, products: [{id:1, name: "Tomato", price: 40, glyph: "🍅", local: "தக்காளி"}, {id:2, name: "Spinach", price: 25, glyph: "🥬", local: "பசலைக்கீரை"}] },
            { id: "chai", name: "Chai Corner", fullName: "Chai Corner", tamil: "சாய் கார்னர்", origin: "Coorg", colors: {top:"#E8920E", front:"#F0A83B", left:"#B36B00"}, emoji: "☕", col: 4, row: 0, w: 2, d: 2, h: 3, products: [{id:3, name: "Cutting Chai", price: 10, glyph: "🍵", local: "சாய்"}] }
        ];

        /* ── COMPONENTS ── */
        const Lotus = ({ size=48, fc="#7A1818", gc="#B8860B" }) => (
            <svg width={size} height={size} viewBox="0 0 120 120">
                <g transform="translate(60,60)">
                    {[...Array(16)].map((_,i)=>(<ellipse key={i} cx="0" cy="-50" rx="2.5" ry="6" fill={gc} transform={"rotate("+(i*22.5)+")"}/>))}
                    {[...Array(8)].map((_,i)=>(<path key={i} d="M0-10C-10-22-10-38 0-42C10-38 10-22 0-10Z" fill={fc} transform={"rotate("+(i*45)+")"}/>))}
                </g>
            </svg>
        );

        function Building({ shop, onClick }) {
            const { col:c, row:r, w, d, h, colors } = shop;
            const F = [iso(c,r,0), iso(c+w,r,0), iso(c+w,r,h), iso(c,r,h)];
            const L = [iso(c,r,0), iso(c,r,h), iso(c,r+d,h), iso(c,r+d,0)];
            const T = [iso(c,r,h), iso(c+w,r,h), iso(c+w,r+d,h), iso(c,r+d,h)];
            return (
                <g onClick={onClick} style={{cursor:"pointer"}}>
                    <polygon points={pts(L)} fill={colors.left} opacity="0.9"/>
                    <polygon points={pts(F)} fill={colors.front}/>
                    <polygon points={pts(T)} fill={colors.top}/>
                    <text x={iso(c+w/2,r,h+.5).x} y={iso(c+w/2,r,h+.5).y} textAnchor="middle" fontSize="7" fontWeight="bold" fill="#1A0F0A">{shop.name}</text>
                </g>
            );
        }

        function App() {
            const [view, setView] = useState("home");
            const [selectedShopId, setSelectedShopId] = useState(null);
            
            const selectedShop = SHOPS.find(s => s.id === selectedShopId);

            return (
                <div style={{ maxWidth: 440, margin: "0 auto", background: "#F5EDD9", minHeight: "100vh" }}>
                    {view === "home" ? (
                        <div style={{animation: "fadeIn 0.5s ease"}}>
                            <header style={{ background: "#7A1818", padding: 20, color: "#DAA520", textAlign: "center" }}>
                                <Lotus size={40} fc="#DAA520" gc="#F5EDD9"/>
                                <div style={{ fontFamily: "'Yatra One', serif", fontSize: 32 }}>Chowk</div>
                                <div style={{ fontSize: 10, letterSpacing: 2 }}>EC PHASE 1 MARKET</div>
                            </header>

                            <div style={{ background: "#E0D5C0" }}>
                                <svg viewBox="100 60 510 320" style={{ width: "100%" }}>
                                    <polygon points={pts([iso(-1,2,0),iso(14,2,0),iso(14,4,0),iso(-1,4,0)])} fill="#B8A898"/>
                                    {SHOPS.map(s => <Building key={s.id} shop={s} onClick={() => { setSelectedShopId(s.id); setView("shop"); }}/>)}
                                </svg>
                            </div>

                            <div style={{ padding: 20 }}>
                                {SHOPS.map(s => (
                                    <div key={s.id} onClick={() => { setSelectedShopId(s.id); setView("shop"); }} style={{ background: "#FFFDF7", padding: 15, marginBottom: 12, display: "flex", alignItems: "center", justifyContent: "space-between", border: "1px solid #1A0F0A15", cursor: "pointer" }}>
                                        <div style={{fontSize: 30}}>{s.emoji}</div>
                                        <div style={{flex: 1, paddingLeft: 15}}>
                                            <div style={{fontFamily: "'Yatra One', serif", fontSize: 18}}>{s.fullName}</div>
                                            <div style={{fontSize: 12, color: "#7A1818"}}>{s.tamil}</div>
                                        </div>
                                        <IconRight />
                                    </div>
                                ))}
                            </div>
                        </div>
                    ) : (
                        <div style={{animation: "fadeIn 0.3s ease"}}>
                            <nav style={{ background: "#7A1818", color: "#F5EDD9", padding: "12px 16px", display: "flex", alignItems: "center", justifyContent: "space-between", position: "sticky", top: 0 }}>
                                <button onClick={() => setView("home")} style={{ background: "rgba(255,255,255,0.1)", border: "none", color: "#F5EDD9", padding: "8px 12px", borderRadius: 20, display: "flex", alignItems: "center", gap: 5, cursor: "pointer", fontWeight: "bold", fontSize: 12 }}>
                                    <IconBack /> BACK
                                </button>
                                <div style={{fontFamily: "'Yatra One', serif"}}>{selectedShop.name}</div>
                            </nav>

                            <div style={{ padding: 16 }}>
                                <div style={{ background: selectedShop.colors.left, padding: 30, color: "#F5EDD9", marginBottom: 20 }}>
                                    <div style={{fontSize: 40}}>{selectedShop.emoji}</div>
                                    <div style={{fontFamily: "'Yatra One', serif", fontSize: 32}}>{selectedShop.fullName}</div>
                                    <div style={{fontFamily: "'Tiro Tamil', serif", opacity: 0.8}}>{selectedShop.tamil}</div>
                                </div>

                                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 15 }}>
                                    {selectedShop.products.map(p => (
                                        <div key={p.id} style={{ background: "#FFFDF7", padding: 15, border: "1px solid #1A0F0A10", textAlign: "center" }}>
                                            <div style={{fontSize: 40}}>{p.glyph}</div>
                                            <div style={{fontFamily: "'Yatra One', serif"}}>{p.name}</div>
                                            <div style={{color: "#B8860B", fontWeight: "bold"}}>₹{p.price}</div>
                                            <button style={{ marginTop: 10, width: "100%", background: "#7A1818", color: "white", border: "none", padding: "5px", cursor: "pointer" }}>ADD</button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

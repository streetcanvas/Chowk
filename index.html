<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chowk</title>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide-react@0.468.0/dist/umd/lucide-react.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Yatra+One&family=Spectral:ital,wght@0,400;0,500;1,400;1,500&family=Cinzel:wght@400;600;700&family=Tiro+Tamil:ital@0;1&display=swap');

    html, body, #root {
      margin: 0;
      min-height: 100%;
      background: #1A0F0A;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .55; }
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    ::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    const {
      X,
      MessageCircle,
      ChevronRight,
      Zap,
      Clock,
      MapPin,
      Bell
    } = lucideReact;

    /* ── ISO MATH ─────────────────────────────────────────────── */
    const TW = 40, TH = 20, HU = 26, OX = 285, OY = 205;

    const iso = (c, r, h = 0) => ({
      x: OX + (c - r) * TW / 2,
      y: OY + (c + r) * TH / 2 - h * HU
    });

    const pts = (arr) =>
      arr.map(({ x, y }) => `${x.toFixed(1)},${y.toFixed(1)}`).join(" ");

    const bilerp = (bl, br, tr, tl, u, v) => ({
      x:
        bl.x * (1 - u) * (1 - v) +
        br.x * u * (1 - v) +
        tr.x * u * v +
        tl.x * (1 - u) * v,
      y:
        bl.y * (1 - u) * (1 - v) +
        br.y * u * (1 - v) +
        tr.y * u * v +
        tl.y * (1 - u) * v,
    });

    /* ── LOTUS ─────────────────────────────────────────────── */
    const Lotus = ({ size = 48, fc = "#7A1818", gc = "#B8860B" }) => (
      <svg width={size} height={size} viewBox="0 0 120 120">
        <g transform="translate(60,60)">
          {[...Array(16)].map((_, i) => (
            <ellipse
              key={i}
              cx="0"
              cy="-50"
              rx="2.5"
              ry="6"
              fill={gc}
              transform={`rotate(${i * 22.5})`}
            />
          ))}

          {[...Array(8)].map((_, i) => (
            <path
              key={i}
              d="M0-10C-10-22-10-38 0-42C10-38 10-22 0-10Z"
              fill={fc}
              transform={`rotate(${i * 45})`}
            />
          ))}

          {[...Array(8)].map((_, i) => (
            <path
              key={i}
              d="M0-4C-6-10-6-22 0-25C6-22 6-10 0-4Z"
              fill={gc}
              transform={`rotate(${i * 45 + 22.5})`}
            />
          ))}

          <circle r="6" fill={fc} />
          <circle r="2.5" fill={gc} />
        </g>
      </svg>
    );

    /* ── KOLAM STRIP ─────────────────────────────────────────────── */
    const KolamStrip = ({ color = "#7A1818", height = 16, opacity = 1 }) => {
      const n = 7;

      return (
        <svg
          width="100%"
          height={height}
          viewBox={`0 0 ${n * 40} 36`}
          preserveAspectRatio="xMidYMid meet"
          style={{ display: "block", opacity }}
        >
          {[...Array(n)].map((_, i) => (
            <g key={i} transform={`translate(${i * 40},0)`}>
              <circle cx="0" cy="18" r="1.2" fill={color} />
              <circle cx="20" cy="6" r="1.2" fill={color} />
              <circle cx="20" cy="30" r="1.2" fill={color} />
              <circle cx="40" cy="18" r="1.2" fill={color} />

              <path
                d="M0 18 Q10 6 20 6 Q30 6 40 18 Q30 30 20 30 Q10 30 0 18Z"
                fill="none"
                stroke={color}
                strokeWidth="0.9"
              />

              <circle cx="20" cy="18" r="1.6" fill={color} />
            </g>
          ))}
        </svg>
      );
    };

    /* ── DATA ─────────────────────────────────────────────── */
    const SHOPS = [
      {
        id: "lakshmi",
        name: "Lakshmi",
        fullName: "Lakshmi Vegetables",
        sub: "Vegetables",
        tamil: "லட்சுமி காய்கறிகள்",
        tagline: "Picked this morning. Sold by evening.",
        since: "2009",
        owner: "Murthy",
        emoji: "🥬",
        col: 0,
        row: 0,
        w: 3,
        d: 2,
        h: 4,
        colors: {
          top: "#C4A820",
          front: "#D8B830",
          left: "#8B1A1A"
        },
        open: true,
        live: true,
        products: [
          {
            id: "t",
            name: "Tomato",
            local: "தக்காளி",
            price: 40,
            mrp: 48,
            unit: "1 kg",
            glyph: "🍅",
            badge: "TODAY"
          },
          {
            id: "s",
            name: "Spinach",
            local: "பசலைக்கீரை",
            price: 25,
            unit: "1 bunch",
            glyph: "🥬"
          }
        ]
      }
    ];

    const TREES = [
      { c: 3, r: 0 },
      { c: 6, r: 0 },
      { c: 3, r: 4 }
    ];

    /* ── TREE ─────────────────────────────────────────────── */
    function Tree({ c, r }) {
      const base = iso(c + .5, r + .5, 0);
      const trunk = iso(c + .5, r + .5, .9);
      const top = iso(c + .5, r + .5, 1.7);

      return (
        <g>
          <line
            x1={base.x}
            y1={base.y}
            x2={trunk.x}
            y2={trunk.y}
            stroke="#5C3310"
            strokeWidth="2.2"
          />

          <ellipse
            cx={top.x}
            cy={top.y}
            rx={11}
            ry={7}
            fill="#2C4A2A"
          />

          <ellipse
            cx={top.x - 3}
            cy={top.y - 3}
            rx={7}
            ry={4.5}
            fill="#3A6035"
          />
        </g>
      );
    }

    /* ── BUILDING ─────────────────────────────────────────────── */
    function Building({ shop, selected, onClick }) {
      const { col:c, row:r, w, d, h, colors } = shop;

      const T = [
        iso(c,r,h),
        iso(c+w,r,h),
        iso(c+w,r+d,h),
        iso(c,r+d,h)
      ];

      const F = [
        iso(c,r,0),
        iso(c+w,r,0),
        iso(c+w,r,h),
        iso(c,r,h)
      ];

      const L = [
        iso(c,r,0),
        iso(c,r,h),
        iso(c,r+d,h),
        iso(c,r+d,0)
      ];

      const lbl = iso(c+w/2, r-.1, h+.55);

      return (
        <g onClick={onClick} style={{ cursor:"pointer" }}>
          <polygon points={pts(L)} fill={colors.left}/>
          <polygon points={pts(F)} fill={colors.front}/>
          <polygon points={pts(T)} fill={colors.top}/>

          <text
            x={lbl.x}
            y={lbl.y}
            textAnchor="middle"
            fontSize="7"
            fontFamily="'Cinzel', serif"
            fill={selected ? "#7A1818" : "#1A0F0A"}
            fontWeight="700"
          >
            {shop.name}
          </text>
        </g>
      );
    }

    /* ── MAIN APP ─────────────────────────────────────────────── */
    function ChowkApp() {
      const [selId, setSelId] = useState(null);

      const sorted = useMemo(() =>
        [...SHOPS].sort(
          (a,b)=>
            (a.col+a.w/2+a.row+a.d/2) -
            (b.col+b.w/2+b.row+b.d/2)
        )
      , []);

      return (
        <div
          style={{
            maxWidth:440,
            margin:"0 auto",
            background:"#1A0F0A",
            minHeight:"100vh"
          }}
        >
          <div
            style={{
              background:"#F5EDD9",
              minHeight:"100vh"
            }}
          >
            {/* HEADER */}
            <header
              style={{
                background:"#7A1818",
                position:"sticky",
                top:0,
                zIndex:30
              }}
            >
              <KolamStrip
                color="#DAA520"
                height={12}
                opacity={0.5}
              />

              <div
                style={{
                  padding:"8px 14px 10px",
                  display:"flex",
                  alignItems:"center",
                  justifyContent:"space-between"
                }}
              >
                <div
                  style={{
                    display:"flex",
                    alignItems:"center",
                    gap:10
                  }}
                >
                  <Lotus
                    size={28}
                    fc="#DAA520"
                    gc="#F5EDD9"
                  />

                  <div>
                    <div
                      style={{
                        fontFamily:"'Yatra One', serif",
                        fontSize:20,
                        color:"#DAA520"
                      }}
                    >
                      Chowk
                    </div>

                    <div
                      style={{
                        fontFamily:"'Tiro Tamil', serif",
                        fontSize:10,
                        color:"#F5EDD9"
                      }}
                    >
                      EC Phase 1 · 8 shops
                    </div>
                  </div>
                </div>

                <div
                  style={{
                    textAlign:"right"
                  }}
                >
                  <div
                    style={{
                      fontFamily:"'Cinzel', serif",
                      fontSize:8,
                      color:"#DAA520",
                      fontWeight:700
                    }}
                  >
                    WED 06 MAY
                  </div>
                </div>
              </div>
            </header>

            {/* MAP */}
            <div style={{ position:"relative" }}>
              <svg
                viewBox="100 60 510 360"
                style={{
                  width:"100%",
                  height:"auto",
                  display:"block"
                }}
              >
                <polygon
                  points={pts([
                    iso(-1,0,0),
                    iso(14,0,0),
                    iso(14,2,0),
                    iso(-1,2,0)
                  ])}
                  fill="#F0E5CC"
                />

                <polygon
                  points={pts([
                    iso(-1,2,0),
                    iso(14,2,0),
                    iso(14,4,0),
                    iso(-1,4,0)
                  ])}
                  fill="#B8A898"
                />

                {TREES.map((t,i)=>
                  <Tree
                    key={i}
                    c={t.c}
                    r={t.r}
                  />
                )}

                {sorted.map(s=>(
                  <Building
                    key={s.id}
                    shop={s}
                    selected={selId===s.id}
                    onClick={() =>
                      setSelId(selId===s.id ? null : s.id)
                    }
                  />
                ))}
              </svg>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM
      .createRoot(document.getElementById("root"))
      .render(<ChowkApp />);
  </script>
</body>
</html>

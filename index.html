<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chowk V2 | Storefront</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Yatra+One&family=Spectral:ital,wght@0,400;0,500;1,400;1,500&family=Cinzel:wght@400;600;700&family=Tiro+Tamil:ital@0;1&display=swap');
        body { margin: 0; background: #1A0F0A; font-family: 'Spectral', serif; overflow-x: hidden; }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        ::-webkit-scrollbar { display: none; }
        @keyframes slideInLeft { from { transform: translateX(-20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;
        const { X, MessageCircle, ChevronRight, Zap, Clock, MapPin, Bell, Search, ArrowLeft, Plus, Minus } = lucide;

        /* ── ISO MATH ── */
        const TW=40, TH=20, HU=26, OX=285, OY=205;
        const iso = (c,r,h=0) => ({ x: OX+(c-r)*TW/2, y: OY+(c+r)*TH/2-h*HU });
        const pts = (arr) => arr.map(({x,y}) => `${x.toFixed(1)},${y.toFixed(1)}`).join(" ");

        /* ── ORNAMENTS ── */
        const Lotus = ({ size=48, fc="#7A1818", gc="#B8860B" }) => (
            <svg width={size} height={size} viewBox="0 0 120 120">
                <g transform="translate(60,60)">
                    {[...Array(16)].map((_,i)=>(<ellipse key={i} cx="0" cy="-50" rx="2.5" ry="6" fill={gc} transform={`rotate(${i*22.5})`}/>))}
                    {[...Array(8)].map((_,i)=>(<path key={i} d="M0-10C-10-22-10-38 0-42C10-38 10-22 0-10Z" fill={fc} transform={`rotate(${i*45})`}/>))}
                    <circle r="6" fill={fc}/><circle r="2.5" fill={gc}/>
                </g>
            </svg>
        );

        /* ── DATA ── */
        const SHOPS = [
            { id:"lakshmi", name:"Lakshmi", fullName:"Lakshmi Vegetables", sub:"Vegetables", tamil:"லட்சுமி காயகறிகள்", origin:"Hosur · Ooty", colors:{top:"#C4A820", front:"#D8B830", left:"#8B1A1A"}, emoji:"🥬", col:0, row:0, w:3, d:2, h:4, live:true, products:[{id:"t", name:"Tomato", price:40, glyph:"🍅", local:"தக்காளி"}, {id:"s", name:"Spinach", price:25, glyph:"🥬", local:"பசலைக்கீரை"}] },
            { id:"chai", name:"Chai Corner", fullName:"Chai Corner", sub:"Tea & Snacks", tamil:"சாய் கார்னர்", origin:"Coorg", colors:{top:"#E8920E", front:"#F0A83B", left:"#B36B00"}, emoji:"☕", col:4, row:0, w:2, d:2, h:3, live:true, products:[{id:"cc", name:"Cutting Chai", price:10, glyph:"🍵", local:"சாய்"}] }
        ];

        /* ── COMPONENTS ── */
        function Building({ shop, onClick }) {
            const { col:c, row:r, w, d, h, colors, live } = shop;
            const F = [iso(c,r,0), iso(c+w,r,0), iso(c+w,r,h), iso(c,r,h)];
            const L = [iso(c,r,0), iso(c,r,h), iso(c,r+d,h), iso(c,r+d,0)];
            const T = [iso(c,r,h), iso(c+w,r,h), iso(c+w,r+d,h), iso(c,r+d,h)];
            return (
                <g onClick={onClick} style={{cursor:"pointer"}}>
                    <polygon points={pts(L)} fill={colors.left} opacity="0.9"/>
                    <polygon points={pts(F)} fill={colors.front}/>
                    <polygon points={pts(T)} fill={colors.top}/>
                    {live && <circle cx={iso(c+w*.5,r,h+.15).x} cy={iso(c+w*.5,r,h+.15).y} r="3" fill="#2DA85A" stroke="#FFF" strokeWidth="0.5"/>}
                    <text x={iso(c+w/2,r,h+.5).x} y={iso(c+w/2,r,h+.5).y} textAnchor="middle" fontSize="6" fontWeight="bold" fill="#1A0F0A">{shop.name}</text>
                </g>
            );
        }

        /* ── MAIN APP ── */
        export default function ChowkApp() {
            const [currentShop, setCurrentShop] = useState(null);
            const [cart, setCart] = useState({});
            const shop = SHOPS.find(s => s.id === currentShop);

            return (
                <div style={{ maxWidth: 440, margin: "0 auto", background: "#F5EDD9", minHeight: "100vh", position: "relative" }}>
                    
                    {!currentShop ? (
                        /* ── HOME VIEW (CHOWK MAP) ── */
                        <>
                            <header style={{ background: "#7A1818", padding: "20px 16px", color: "#DAA520", borderBottom: "2px solid #DAA520" }}>
                                <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                                    <Lotus size={32} fc="#DAA520" gc="#F5EDD9"/>
                                    <div>
                                        <div style={{ fontFamily: "'Yatra One', serif", fontSize: 28, lineHeight: 1 }}>Chowk</div>
                                        <div style={{ fontSize: 10, letterSpacing: "1px", opacity: 0.8 }}>EC PHASE 1 MARKETPLACE</div>
                                    </div>
                                </div>
                            </header>

                            <div style={{ background: "#E0D5C0", borderBottom: "1px solid #1A0F0A20" }}>
                                <svg viewBox="100 60 510 320" style={{ width: "100%" }}>
                                    <polygon points={pts([iso(-1,2,0),iso(14,2,0),iso(14,4,0),iso(-1,4,0)])} fill="#B8A898"/>
                                    {SHOPS.map(s => <Building key={s.id} shop={s} onClick={() => setCurrentShop(s.id)}/>)}
                                </svg>
                            </div>

                            <div style={{ padding: 16 }}>
                                <div style={{ fontFamily: "'Cinzel', serif", fontSize: 10, color: "#7A1818", fontWeight: 700, marginBottom: 15 }}>॥ NEARBY SHOPS ॥</div>
                                {SHOPS.map(s => (
                                    <div key={s.id} onClick={() => setCurrentShop(s.id)} style={{ background: "#FFFDF7", padding: 12, marginBottom: 12, border: "1px solid #1A0F0A10", display: "flex", alignItems: "center", gap: 15, cursor: "pointer" }}>
                                        <div style={{ fontSize: 32 }}>{s.emoji}</div>
                                        <div style={{ flex: 1 }}>
                                            <div style={{ fontFamily: "'Yatra One', serif", fontSize: 18 }}>{s.fullName}</div>
                                            <div style={{ fontSize: 11, color: "#7A1818" }}>{s.tamil} • {s.origin}</div>
                                        </div>
                                        <ChevronRight size={18} color="#7A1818"/>
                                    </div>
                                ))}
                            </div>
                        </>
                    ) : (
                        /* ── SHOP STOREFRONT VIEW ── */
                        <div style={{ animation: "fadeIn 0.3s ease" }}>
                            
                            {/* NEW TOP NAVIGATION WITH BACK BUTTON */}
                            <nav style={{ 
                                background: "#7A1818", 
                                padding: "12px 16px", 
                                color: "#F5EDD9", 
                                display: "flex", 
                                alignItems: "center", 
                                justifyContent: "space-between",
                                position: "sticky",
                                top: 0,
                                zIndex: 100,
                                borderBottom: "1.5px solid #DAA520"
                            }}>
                                <button 
                                    onClick={() => setCurrentShop(null)} 
                                    style={{ 
                                        background: "rgba(255,255,255,0.15)", 
                                        border: "none", 
                                        borderRadius: "20px", 
                                        padding: "6px 12px",
                                        display: "flex", 
                                        alignItems: "center", 
                                        gap: 8,
                                        cursor: "pointer",
                                        color: "#F5EDD9",
                                        fontFamily: "'Cinzel', serif",
                                        fontSize: 10,
                                        fontWeight: 700
                                    }}
                                >
                                    <ArrowLeft size={16}/> BACK TO CHOWK
                                </button>
                                
                                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                                    <div style={{ textAlign: "right" }}>
                                        <div style={{ fontFamily: "'Yatra One', serif", fontSize: 14 }}>{shop.name}</div>
                                        <div style={{ fontSize: 8, color: "#DAA520" }}>LIVE NOW</div>
                                    </div>
                                    <Lotus size={24} fc="#DAA520" gc="#F5EDD9"/>
                                </div>
                            </nav>

                            <div style={{ padding: 16 }}>
                                <div style={{ 
                                    background: `linear-gradient(150deg, ${shop.colors.left}, ${shop.colors.front})`, 
                                    padding: 25, 
                                    color: "#F5EDD9", 
                                    marginBottom: 20,
                                    boxShadow: "0 4px 15px rgba(0,0,0,0.1)"
                                }}>
                                    <div style={{ fontSize: 40, marginBottom: 10 }}>{shop.emoji}</div>
                                    <div style={{ fontFamily: "'Yatra One', serif", fontSize: 32, lineHeight: 1 }}>{shop.fullName}</div>
                                    <div style={{ fontFamily: "'Tiro Tamil', serif", fontSize: 16, opacity: 0.9 }}>{shop.tamil}</div>
                                    <div style={{ marginTop: 15, fontSize: 12, borderTop: "1px solid rgba(255,255,255,0.2)", paddingTop: 10 }}>
                                        Fresh from {shop.origin}
                                    </div>
                                </div>

                                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
                                    {shop.products.map(p => (
                                        <div key={p.id} style={{ background: "#FFFDF7", padding: 12, border: "1px solid #1A0F0A08" }}>
                                            <div style={{ fontSize: 30, marginBottom: 8 }}>{p.glyph}</div>
                                            <div style={{ fontFamily: "'Yatra One', serif", fontSize: 16 }}>{p.name}</div>
                                            <div style={{ color: "#7A1818", fontSize: 11 }}>{p.local}</div>
                                            <div style={{ marginTop: 10, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                                                <span style={{ fontWeight: "bold", color: "#B8860B" }}>₹{p.price}</span>
                                                <button style={{ border: "1px solid #7A1818", background: "none", color: "#7A1818", padding: "4px 8px", fontSize: 10 }}>ADD +</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ChowkApp />);
    </script>
</body>
</html>
